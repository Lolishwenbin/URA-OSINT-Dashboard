    dormitory:data.filter(d=>d.suspected_issue.includes("Dormitory")).length,
    reviewed:data.filter(d=>d.review_status!=="Pending").length,
    pending:data.filter(d=>d.review_status==="Pending").length
  };

  const updateReview=(idx,status)=>{
    setData(prev=>{const n=[...prev];n[idx]={...n[idx],review_status:status};return n});
  };

  const handleImport=()=>{
    try{const parsed=JSON.parse(jsonInput);const arr=Array.isArray(parsed)?parsed:[parsed];const existing=new Set(data.map(d=>d.source_post_id));const newItems=arr.filter(i=>!existing.has(i.source_post_id)).map(i=>({...i,priority:i.priority||"Medium",keywords_matched:i.keywords_matched||[],notes:i.notes||"",property_type:i.property_type||"Unknown",suspected_issue:i.suspected_issue||"Unclassified",advertised_duration:i.advertised_duration||"Unknown",completeness:i.completeness||0,review_status:"Pending"}));
    if(!newItems.length){setImportMsg("No new listings (all duplicates)");}else{setData(prev=>[...prev,...newItems]);setImportMsg(newItems.length+" listings added.");}setJsonInput("");setTimeout(()=>setImportMsg(""),3000);}catch(e){setImportMsg("Invalid JSON.");setTimeout(()=>setImportMsg(""),3000);}
  };

  const exportCSV=()=>{
    const h=["source","post_url","raw_text","raw_price_text","poster_handle","raw_location_text","property_type","suspected_issue","advertised_duration","priority","review_status","keywords_matched","notes","completeness","scraped_at"];
    const rows=filtered.map(d=>h.map(k=>{const v=k==="keywords_matched"?(d[k]||[]).join("; "):(d[k]||"");return '"'+String(v).replace(/"/g,'""')+'"'}));
    const csv=[h.join(","),...rows.map(r=>r.join(","))].join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ura-osint-export-"+new Date().toISOString().split("T")[0]+".csv";a.click();
  };

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(filtered,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ura-osint-export-"+new Date().toISOString().split("T")[0]+".json";a.click();
  };

  return <div style={{padding:"24px 28px",maxWidth:1200,margin:"0 auto"}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:40,height:40,background:"#1E3A5F",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:700,fontSize:20}}>T</div>
        <div>
          <div style={{fontSize:20,fontWeight:700,color:"#0F172A",letterSpacing:"-0.3px"}}>URA OSINT Monitor</div>
          <div style={{fontSize:12,color:"#94A3B8",marginTop:1}}>Illegal Accommodation Detection Platform / Talons Laboratories</div>
        </div>
      </div>
      <div style={{fontSize:11,color:"#94A3B8",textAlign:"right"}}>Last updated<br/>{new Date().toLocaleDateString("en-SG",{day:"numeric",month:"short",year:"numeric"})}</div>
    </div>

    {/* Tabs */}
    <div style={{display:"flex",gap:0,marginBottom:20,borderBottom:"2px solid #E2E8F0"}}>
      {[["listings","Listings"],["stats","Summary"]].map(([key,label])=>
        <button key={key} onClick={()=>setTab(key)} style={{padding:"8px 20px",fontSize:13,fontWeight:tab===key?600:400,color:tab===key?"#1E3A5F":"#94A3B8",background:"none",border:"none",borderBottom:tab===key?"2px solid #1E3A5F":"2px solid transparent",marginBottom:-2,cursor:"pointer"}}>{label}</button>
      )}
    </div>

    {tab==="stats" && <div>
      {/* Stats Grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(150px, 1fr))",gap:10,marginBottom:20}}>
        {[{l:"Total Listings",v:stats.total,c:"#1E3A5F"},{l:"High Priority",v:stats.high,c:"#EF4444"},{l:"Medium Priority",v:stats.medium,c:"#F59E0B"},{l:"Low Priority",v:stats.low,c:"#10B981"},{l:"Short-term Cases",v:stats.shortTerm,c:"#3B82F6"},{l:"Dormitory Cases",v:stats.dormitory,c:"#8B5CF6"},{l:"Reviewed",v:stats.reviewed,c:"#059669"},{l:"Pending Review",v:stats.pending,c:"#DC2626"}].map((s,i)=>
          <div key={i} style={{background:"white",borderRadius:10,padding:"14px 16px",boxShadow:"0 1px 2px rgba(0,0,0,0.05)",borderTop:"3px solid "+s.c}}>
            <div style={{fontSize:28,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:11,color:"#94A3B8",marginTop:4}}>{s.l}</div>
          </div>
        )}
      </div>

      {/* Breakdown tables */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div style={{background:"white",borderRadius:10,padding:18,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#334155",marginBottom:12}}>By Property Type</div>
          {["HDB","Condo / EC","Landed","Shophouse","Unknown"].map(p=>{const count=data.filter(d=>d.property_type===p).length;return count?<div key={p} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F1F5F9"}}><span style={{fontSize:12,color:"#475569"}}>{p}</span><span style={{fontSize:12,fontWeight:600,color:"#334155"}}>{count}</span></div>:null})}
        </div>
        <div style={{background:"white",borderRadius:10,padding:18,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#334155",marginBottom:12}}>By Suspected Issue</div>
          {["Short-term Accommodation","Unauthorised Dormitory","Short-term + Dormitory","Unclassified"].map(p=>{const count=data.filter(d=>d.suspected_issue===p).length;return count?<div key={p} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F1F5F9"}}><span style={{fontSize:12,color:"#475569"}}>{p}</span><span style={{fontSize:12,fontWeight:600,color:"#334155"}}>{count}</span></div>:null})}
        </div>
        <div style={{background:"white",borderRadius:10,padding:18,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#334155",marginBottom:12}}>By Review Status</div>
          {reviewStatuses.map(s=>{const count=data.filter(d=>d.review_status===s).length;return count?<div key={s} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F1F5F9"}}><span style={{fontSize:12,color:"#475569"}}>{s}</span><span style={{fontSize:12,fontWeight:600,color:"#334155"}}>{count}</span></div>:null})}
        </div>
        <div style={{background:"white",borderRadius:10,padding:18,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#334155",marginBottom:12}}>By Duration Advertised</div>
          {["Daily","Weekly","1-2 months","Short-term (unspecified)","Unknown"].map(p=>{const count=data.filter(d=>d.advertised_duration===p).length;return count?<div key={p} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F1F5F9"}}><span style={{fontSize:12,color:"#475569"}}>{p}</span><span style={{fontSize:12,fontWeight:600,color:"#334155"}}>{count}</span></div>:null})}
        </div>
      </div>
    </div>}

    {tab==="listings" && <div>
      {/* Quick stats */}
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {[{l:"Total",v:stats.total,c:"#1E3A5F"},{l:"High",v:stats.high,c:"#EF4444"},{l:"Medium",v:stats.medium,c:"#F59E0B"},{l:"Low",v:stats.low,c:"#10B981"}].map((s,i)=>
          <div key={i} style={{background:"white",borderRadius:8,padding:"8px 14px",boxShadow:"0 1px 2px rgba(0,0,0,0.04)",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</span>
            <span style={{fontSize:11,color:"#94A3B8"}}>{s.l}</span>
          </div>
        )}
      </div>

      {/* Controls */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14,alignItems:"center"}}>
        <input type="text" placeholder="Search..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} style={{padding:"7px 12px",borderRadius:7,border:"1px solid #E2E8F0",fontSize:12,outline:"none",background:"white",width:160}}/>
        <select value={filterPriority} onChange={e=>setFilterPriority(e.target.value)} style={{padding:"7px 10px",borderRadius:7,border:"1px solid #E2E8F0",fontSize:12,background:"white"}}>
          <option value="ALL">All Priority</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option>
        </select>
        <select value={filterIssue} onChange={e=>setFilterIssue(e.target.value)} style={{padding:"7px 10px",borderRadius:7,border:"1px solid #E2E8F0",fontSize:12,background:"white"}}>
          <option value="ALL">All Issues</option><option value="Short-term">Short-term</option><option value="Dormitory">Dormitory</option>
        </select>
        <select value={filterProp} onChange={e=>setFilterProp(e.target.value)} style={{padding:"7px 10px",borderRadius:7,border:"1px solid #E2E8F0",fontSize:12,background:"white"}}>
          <option value="ALL">All Property</option><option value="HDB">HDB</option><option value="Condo / EC">Condo</option><option value="Landed">Landed</option><option value="Shophouse">Shophouse</option><option value="Unknown">Unknown</option>
        </select>
        <select value={filterReview} onChange={e=>setFilterReview(e.target.value)} style={{padding:"7px 10px",borderRadius:7,border:"1px solid #E2E8F0",fontSize:12,background:"white"}}>
          <option value="ALL">All Status</option>{reviewStatuses.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          <button onClick={()=>setShowImport(!showImport)} style={{padding:"7px 14px",borderRadius:7,border:"1px solid #E2E8F0",background:"white",fontSize:11,cursor:"pointer",color:"#475569"}}>Import</button>
          <button onClick={exportCSV} style={{padding:"7px 14px",borderRadius:7,border:"1px solid #E2E8F0",background:"white",fontSize:11,cursor:"pointer",color:"#475569"}}>CSV</button>
          <button onClick={exportJSON} style={{padding:"7px 14px",borderRadius:7,border:"none",background:"#1E3A5F",color:"white",fontSize:11,cursor:"pointer"}}>Export JSON</button>
        </div>
      </div>

      {/* Import */}
      {showImport&&<div style={{background:"white",borderRadius:10,padding:16,marginBottom:14,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
        <div style={{fontSize:12,fontWeight:600,color:"#334155",marginBottom:8}}>Import scraped data (JSON)</div>
        <textarea value={jsonInput} onChange={e=>setJsonInput(e.target.value)} rows={4} style={{width:"100%",padding:10,borderRadius:7,border:"1px solid #E2E8F0",fontSize:11,fontFamily:"monospace",resize:"vertical",boxSizing:"border-box"}} placeholder='Paste JSON array...'/>
        <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center"}}>
          <button onClick={handleImport} style={{padding:"6px 16px",borderRadius:7,border:"none",background:"#1E3A5F",color:"white",fontSize:11,cursor:"pointer"}}>Add</button>
          <button onClick={()=>{setShowImport(false);setJsonInput("")}} style={{padding:"6px 16px",borderRadius:7,border:"1px solid #E2E8F0",background:"white",fontSize:11,cursor:"pointer",color:"#64748B"}}>Cancel</button>
          {importMsg&&<span style={{fontSize:11,color:"#64748B"}}>{importMsg}</span>}
        </div>
      </div>}

      <div style={{fontSize:12,color:"#94A3B8",marginBottom:10}}>Showing {filtered.length} of {data.length} listings</div>

      {/* Listing Cards */}
      {filtered.map((item,i)=>{
        const pri=priorityColors[item.priority]||priorityColors.Low;
        const src=sourceColors[item.source]||{bg:"#F1F5F9",text:"#475569"};
        const iss=issueColors[item.suspected_issue]||issueColors.Unclassified;
        const prop=propColors[item.property_type]||propColors.Unknown;
        const rev=reviewColors[item.review_status]||reviewColors.Pending;
        const isOpen=selectedListing===i;
        const globalIdx=data.indexOf(item);

        return <div key={item.source_post_id||i} onClick={()=>setSelectedListing(isOpen?null:i)} style={{background:"white",borderRadius:10,padding:"14px 18px",boxShadow:isOpen?"0 2px 8px rgba(0,0,0,0.08)":"0 1px 2px rgba(0,0,0,0.04)",cursor:"pointer",transition:"box-shadow 0.15s",borderLeft:"4px solid "+pri.dot,marginBottom:8}}>
          
          {/* Top row */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:"#0F172A",marginBottom:6,lineHeight:1.4}}>{item.raw_text}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,alignItems:"center"}}>
                <Tag label={item.priority+" Priority"} colors={pri}/>
                <Tag label={item.source} colors={src}/>
                <Tag label={item.suspected_issue} colors={iss}/>
                <Tag label={item.property_type} colors={prop}/>
                <Tag label={item.review_status} colors={rev}/>
                {item.raw_location_text&&<span style={{fontSize:11,color:"#64748B",marginLeft:2}}>{item.raw_location_text}</span>}
              </div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:15,fontWeight:700,color:"#0F172A"}}>{item.raw_price_text||"No price"}</div>
              {item.poster_handle&&<div style={{fontSize:10,color:"#94A3B8",marginTop:2}}>@{item.poster_handle}</div>}
              <div style={{marginTop:4}}><Completeness pct={item.completeness}/></div>
            </div>
          </div>

          {/* Expanded */}
          {isOpen&&<div style={{marginTop:14,paddingTop:14,borderTop:"1px solid #F1F5F9"}} onClick={e=>e.stopPropagation()}>
            
            {/* Detail grid */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              <div><span style={{fontSize:10,fontWeight:600,color:"#94A3B8"}}>Advertised Duration</span><div style={{fontSize:12,color:"#334155",marginTop:2}}>{item.advertised_duration}</div></div>
              <div><span style={{fontSize:10,fontWeight:600,color:"#94A3B8"}}>Property Type</span><div style={{fontSize:12,color:"#334155",marginTop:2}}>{item.property_type}</div></div>
              <div><span style={{fontSize:10,fontWeight:600,color:"#94A3B8"}}>Suspected Issue</span><div style={{fontSize:12,color:"#334155",marginTop:2}}>{item.suspected_issue}</div></div>
              <div><span style={{fontSize:10,fontWeight:600,color:"#94A3B8"}}>Language</span><div style={{fontSize:12,color:"#334155",marginTop:2}}>{(item.language_detected||"unknown").toUpperCase()}</div></div>
            </div>

            {/* Keywords */}
            {item.keywords_matched&&item.keywords_matched.length>0&&<div style={{marginBottom:10}}>
              <span style={{fontSize:10,fontWeight:600,color:"#94A3B8"}}>Keywords Matched</span>
              <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:4}}>{item.keywords_matched.map((kw,ki)=><Tag key={ki} label={kw} colors={{bg:"#EFF6FF",text:"#1D4ED8"}}/>)}</div>
            </div>}

            {/* Notes */}
            {item.notes&&<div style={{marginBottom:10}}><span style={{fontSize:10,fontWeight:600,color:"#94A3B8"}}>Notes</span><div style={{fontSize:12,color:"#334155",marginTop:2}}>{item.notes}</div></div>}

            {/* Meta */}
            <div style={{display:"flex",gap:16,fontSize:11,color:"#94A3B8",marginBottom:12}}>
              <span>Scraped: {new Date(item.scraped_at).toLocaleDateString("en-SG")}</span>
              <span>Completeness: {item.completeness}%</span>
            </div>

            {item.post_url&&<a href={item.post_url} target="_blank" rel="noopener noreferrer" style={{display:"inline-block",fontSize:12,color:"#1E3A5F",textDecoration:"none",fontWeight:500,marginBottom:14}}>View original listing &#8599;</a>}

            {/* Review Actions */}
            <div style={{borderTop:"1px solid #F1F5F9",paddingTop:12}}>
              <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",marginBottom:8}}>Review Action</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {reviewStatuses.filter(s=>s!=="Pending").map(status=>{
                  const rc=reviewColors[status];
                  const isActive=item.review_status===status;
                  return <button key={status} onClick={()=>updateReview(globalIdx,isActive?"Pending":status)} style={{padding:"5px 12px",borderRadius:6,border:isActive?"2px solid "+rc.text:"1px solid #E2E8F0",background:isActive?rc.bg:"white",fontSize:11,cursor:"pointer",color:isActive?rc.text:"#64748B",fontWeight:isActive?600:400}}>{status}</button>
                })}
              </div>
            </div>
          </div>}
        </div>
      })}

      {!filtered.length&&<div style={{textAlign:"center",padding:48,color:"#94A3B8",fontSize:13}}>No listings match the current filters.</div>}
    </div>}

    <div style={{textAlign:"center",padding:"28px 0 12px",fontSize:11,color:"#CBD5E1"}}>Talons Laboratories - URA OSINT Monitoring Platform MVP</div>
  </div>
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
