function App() {
  const [data, setData] = useState(SAMPLE_DATA);
  const [filterRisk, setFilterRisk] = useState("ALL");
  const [filterSource, setFilterSource] = useState("ALL");
  const [searchTerm, setSearchTerm] = useState("");
  const [selectedListing, setSelectedListing] = useState(null);
  const [jsonInput, setJsonInput] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importMsg, setImportMsg] = useState("");

  const filtered = data.filter(item => {
    if (filterRisk !== "ALL" && item.risk_level !== filterRisk) return false;
    if (filterSource !== "ALL" && item.source !== filterSource) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      if (!item.raw_text.toLowerCase().includes(s) &&
          !item.poster_handle.toLowerCase().includes(s) &&
          !(item.raw_location_text || "").toLowerCase().includes(s) &&
          !(item.raw_price_text || "").toLowerCase().includes(s)) return false;
    }
    return true;
  });

  const stats = {
    total: data.length,
    high: data.filter(d => d.risk_level === "HIGH").length,
    medium: data.filter(d => d.risk_level === "MEDIUM").length,
    low: data.filter(d => d.risk_level === "LOW").length,
    sources: [...new Set(data.map(d => d.source))].length,
    keywords: [...new Set(data.flatMap(d => d.keywords_matched || []))].length
  };

  const handleImport = () => {
    try {
      const parsed = JSON.parse(jsonInput);
      const arr = Array.isArray(parsed) ? parsed : [parsed];
      const existing = new Set(data.map(d => d.source_post_id));
      const newItems = arr.filter(item => !existing.has(item.source_post_id)).map(item => ({
        ...item,
        risk_level: item.risk_level || "MEDIUM",
        keywords_matched: item.keywords_matched || [],
        notes: item.notes || ""
      }));
      if (newItems.length === 0) {
        setImportMsg("No new listings to add (all duplicates).");
      } else {
        setData(prev => [...prev, ...newItems]);
        setImportMsg(newItems.length + " listings added.");
      }
      setJsonInput("");
      setTimeout(() => setImportMsg(""), 3000);
    } catch (e) {
      setImportMsg("Invalid JSON. Check the format.");
      setTimeout(() => setImportMsg(""), 3000);
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setJsonInput(ev.target.result);
    };
    reader.readAsText(file);
  };

  const exportCSV = () => {
    const headers = ["source","source_post_id","post_url","raw_text","raw_price_text","poster_handle","language_detected","raw_location_text","risk_level","keywords_matched","notes","scraped_at"];
    const rows = filtered.map(d => headers.map(h => {
      const val = h === "keywords_matched" ? (d[h] || []).join("; ") : (d[h] || "");
      return '"' + String(val).replace(/"/g, '""') + '"';
    }));
    const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ura-osint-flagged-listings-" + new Date().toISOString().split("T")[0] + ".csv";
    a.click();
  };

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(filtered, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ura-osint-flagged-listings-" + new Date().toISOString().split("T")[0] + ".json";
    a.click();
  };

  const s = {
    page: { padding: "28px 32px", maxWidth: 1100, margin: "0 auto" },
    headerBar: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 28 },
    logo: { display: "flex", alignItems: "center", gap: 14 },
    logoMark: { width: 36, height: 36, background: "#1E3A5F", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", color: "white", fontWeight: 700, fontSize: 18 },
    title: { fontSize: 20, fontWeight: 700, color: "#0F172A", letterSpacing: "-0.3px" },
    subtitle: { fontSize: 12, color: "#94A3B8", marginTop: 2 },
    timestamp: { fontSize: 11, color: "#94A3B8", textAlign: "right", marginTop: 4 },
    statsRow: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10, marginBottom: 22 },
    statCard: (color) => ({ background: "white", borderRadius: 10, padding: "14px 16px", boxShadow: "0 1px 2px rgba(0,0,0,0.05)", borderTop: "3px solid " + color }),
    statVal: (color) => ({ fontSize: 26, fontWeight: 700, color: color, lineHeight: 1 }),
    statLabel: { fontSize: 11, color: "#94A3B8", marginTop: 4 },
    controls: { display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16, alignItems: "center" },
    input: { padding: "7px 12px", borderRadius: 7, border: "1px solid #E2E8F0", fontSize: 13, outline: "none", background: "white" },
    select: { padding: "7px 10px", borderRadius: 7, border: "1px solid #E2E8F0", fontSize: 13, background: "white", cursor: "pointer" },
    btnPrimary: { padding: "7px 16px", borderRadius: 7, border: "none", background: "#1E3A5F", color: "white", fontSize: 12, fontWeight: 500, cursor: "pointer" },
    btnSecondary: { padding: "7px 16px", borderRadius: 7, border: "1px solid #E2E8F0", background: "white", fontSize: 12, cursor: "pointer", color: "#475569" },
    importPanel: { background: "white", borderRadius: 10, padding: 18, marginBottom: 16, boxShadow: "0 1px 2px rgba(0,0,0,0.05)" },
    listing: (borderColor, isOpen) => ({
      background: "white", borderRadius: 10, padding: "14px 18px",
      boxShadow: isOpen ? "0 2px 8px rgba(0,0,0,0.08)" : "0 1px 2px rgba(0,0,0,0.04)",
      cursor: "pointer", transition: "box-shadow 0.15s", borderLeft: "4px solid " + borderColor, marginBottom: 8
    }),
    tag: (bg, text) => ({ display: "inline-block", padding: "2px 7px", borderRadius: 4, fontSize: 10, fontWeight: 600, background: bg, color: text, letterSpacing: "0.2px" }),
    expandedSection: { marginTop: 12, paddingTop: 12, borderTop: "1px solid #F1F5F9" },
    metaLabel: { fontSize: 11, fontWeight: 600, color: "#94A3B8", marginRight: 4 },
    metaVal: { fontSize: 12, color: "#334155" },
    link: { display: "inline-block", marginTop: 8, fontSize: 12, color: "#1E3A5F", textDecoration: "none", fontWeight: 500 },
    count: { fontSize: 12, color: "#94A3B8", marginBottom: 10 }
  };

  return (
    <div style={s.page}>
      {/* Header */}
      <div style={s.headerBar}>
        <div style={s.logo}>
          <div style={s.logoMark}>T</div>
          <div>
            <div style={s.title}>URA OSINT Monitor</div>
            <div style={s.subtitle}>Illegal Accommodation Detection / Talons Laboratories</div>
          </div>
        </div>
        <div style={s.timestamp}>
          Last updated<br/>{new Date().toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" })}
        </div>
      </div>

      {/* Stats */}
      <div style={s.statsRow}>
        {[
          { label: "Total Scraped", value: stats.total, color: "#1E3A5F" },
          { label: "High Risk", value: stats.high, color: "#EF4444" },
          { label: "Medium Risk", value: stats.medium, color: "#F59E0B" },
          { label: "Low Risk", value: stats.low, color: "#10B981" },
          { label: "Platforms", value: stats.sources, color: "#6366F1" },
          { label: "Keywords Hit", value: stats.keywords, color: "#8B5CF6" }
        ].map((item, i) => (
          <div key={i} style={s.statCard(item.color)}>
            <div style={s.statVal(item.color)}>{item.value}</div>
            <div style={s.statLabel}>{item.label}</div>
          </div>
        ))}
      </div>

      {/* Controls */}
      <div style={s.controls}>
        <input type="text" placeholder="Search listings..." value={searchTerm}
          onChange={e => setSearchTerm(e.target.value)} style={{...s.input, width: 180}} />
        <select value={filterRisk} onChange={e => setFilterRisk(e.target.value)} style={s.select}>
          <option value="ALL">All Risk Levels</option>
          <option value="HIGH">High Risk</option>
          <option value="MEDIUM">Medium Risk</option>
          <option value="LOW">Low Risk</option>
        </select>
        <select value={filterSource} onChange={e => setFilterSource(e.target.value)} style={s.select}>
          <option value="ALL">All Platforms</option>
          <option value="carousell">Carousell</option>
          <option value="facebook_marketplace">Facebook</option>
          <option value="xiaohongshu">Xiaohongshu</option>
          <option value="telegram">Telegram</option>
        </select>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
          <button onClick={() => setShowImport(!showImport)} style={s.btnSecondary}>Import</button>
          <button onClick={exportCSV} style={s.btnSecondary}>CSV</button>
          <button onClick={exportJSON} style={s.btnPrimary}>Export JSON</button>
        </div>
      </div>

      {/* Import Panel */}
      {showImport && (
        <div style={s.importPanel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: "#334155" }}>Import scraped data</span>
            <label style={{...s.btnSecondary, display: "inline-block", padding: "5px 12px", fontSize: 11}}>
              Upload JSON file
              <input type="file" accept=".json" onChange={handleFileUpload} style={{ display: "none" }} />
            </label>
          </div>
          <textarea value={jsonInput} onChange={e => setJsonInput(e.target.value)} rows={5}
            style={{ width: "100%", padding: 10, borderRadius: 7, border: "1px solid #E2E8F0", fontSize: 11, fontFamily: "monospace", resize: "vertical", boxSizing: "border-box" }}
            placeholder='Paste JSON array or upload a file...' />
          <div style={{ display: "flex", gap: 8, marginTop: 8, alignItems: "center" }}>
            <button onClick={handleImport} style={s.btnPrimary}>Add Listings</button>
            <button onClick={() => { setShowImport(false); setJsonInput(""); }} style={s.btnSecondary}>Cancel</button>
            {importMsg && <span style={{ fontSize: 12, color: "#64748B", marginLeft: 8 }}>{importMsg}</span>}
          </div>
        </div>
      )}

      {/* Count */}
      <div style={s.count}>Showing {filtered.length} of {data.length} listings</div>

      {/* Listings */}
      {filtered.map((item, i) => {
        const risk = riskColors[item.risk_level] || riskColors.MEDIUM;
        const src = sourceColors[item.source] || { bg: "#F1F5F9", text: "#475569" };
        const isOpen = selectedListing === i;

        return (
          <div key={item.source_post_id || i} onClick={() => setSelectedListing(isOpen ? null : i)} style={s.listing(risk.dot, isOpen)}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#0F172A", marginBottom: 6, lineHeight: 1.4 }}>
                  {item.raw_text}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5, alignItems: "center" }}>
                  <span style={s.tag(risk.bg, risk.text)}>{item.risk_level}</span>
                  <span style={s.tag(src.bg, src.text)}>{item.source}</span>
                  {item.language_detected && <span style={s.tag("#F1F5F9", "#64748B")}>{item.language_detected.toUpperCase()}</span>}
                  {item.raw_location_text && <span style={{ fontSize: 11, color: "#64748B", marginLeft: 2 }}>{item.raw_location_text}</span>}
                </div>
              </div>
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: "#0F172A" }}>{item.raw_price_text}</div>
                <div style={{ fontSize: 10, color: "#94A3B8", marginTop: 2 }}>@{item.poster_handle}</div>
              </div>
            </div>

            {isOpen && (
              <div style={s.expandedSection}>
                {item.keywords_matched && item.keywords_matched.length > 0 && (
                  <div style={{ marginBottom: 8 }}>
                    <span style={s.metaLabel}>Keywords:</span>
                    {item.keywords_matched.map((kw, ki) => (
                      <span key={ki} style={{...s.tag("#EFF6FF", "#1D4ED8"), marginLeft: 4, fontWeight: 500}}>{kw}</span>
                    ))}
                  </div>
                )}
                {item.notes && (
                  <div style={{ marginBottom: 8 }}>
                    <span style={s.metaLabel}>Notes:</span>
                    <span style={s.metaVal}>{item.notes}</span>
                  </div>
                )}
                <div style={{ display: "flex", gap: 16, fontSize: 11, color: "#94A3B8" }}>
                  <span>Scraped: {new Date(item.scraped_at).toLocaleDateString("en-SG")}</span>
                  {item.posted_at && <span>Posted: {new Date(item.posted_at).toLocaleDateString("en-SG")}</span>}
                </div>
                <a href={item.post_url} target="_blank" rel="noopener noreferrer" style={s.link}
                  onClick={e => e.stopPropagation()}>
                  View original listing &#8599;
                </a>
              </div>
            )}
          </div>
        );
      })}

      {filtered.length === 0 && (
        <div style={{ textAlign: "center", padding: 48, color: "#94A3B8", fontSize: 13 }}>
          No listings match the current filters.
        </div>
      )}

      {/* Footer */}
      <div style={{ textAlign: "center", padding: "32px 0 16px", fontSize: 11, color: "#CBD5E1" }}>
        Talons Laboratories - URA OSINT Monitoring Tool MVP
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
